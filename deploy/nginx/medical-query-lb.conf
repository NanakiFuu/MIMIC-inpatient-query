# Local single-host load balancer for the MIMIC Demo fixed-query API.
#
# Scope: this nginx, both upstream application instances and the PostgreSQL
# database all run on ONE WSL2 machine. It demonstrates request failover when
# one instance dies; it is NOT a production high-availability design (no
# shared-nothing scaling, no health endpoint probing, single point of failure
# in nginx and the database).
#
# Install (local demo):
#   install -m 0644 deploy/nginx/medical-query-lb.conf /etc/nginx/sites-available/medical-query-lb
#   ln -sfn /etc/nginx/sites-available/medical-query-lb /etc/nginx/sites-enabled/medical-query-lb
#   nginx -t && systemctl reload nginx

upstream medical_query_pool {
    # Passive health checks: after one failed connection the node is taken out
    # of rotation for fail_timeout seconds. nginx has no active health checks
    # in the open-source build, so this is connection-failure driven.
    server 127.0.0.1:8865 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8866 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    access_log /var/log/nginx/medical-query-lb.access.log;
    error_log  /var/log/nginx/medical-query-lb.error.log;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass http://medical_query_pool;

        # Retry the next upstream on a connection error or timeout so that a
        # dead instance does not surface to the client as a failure. The
        # X-Upstream-Addr response header records every upstream that handled
        # the request (comma-separated when a retry happened).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
    }
}
