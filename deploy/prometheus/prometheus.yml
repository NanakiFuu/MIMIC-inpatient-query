global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/medical-query-alerts.yml
scrape_configs:
  - job_name: medical-query
    scrape_timeout: 4s
    static_configs:
      - targets: ['127.0.0.1:8765']
  - job_name: medical-query-compose
    scrape_timeout: 4s
    static_configs:
      - targets: ['127.0.0.1:18765']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
